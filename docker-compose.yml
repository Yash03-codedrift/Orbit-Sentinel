services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USE_TINYDB=true          # No MongoDB needed by default
      - MONGODB_DB_NAME=orbit_sentinel
      - CONJUNCTION_THRESHOLD_KM=5.0
      - PROPAGATION_HOURS=72
      - RISK_THRESHOLD=0.0001
      - WEBHOOK_SECRET=changeme
      - FRONTEND_URL=http://localhost:5173
      - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - ./ml_models:/app/ml_models
      - ./data:/app/data           # TinyDB JSON files persist here
      - ./tle_cache.json:/app/tle_cache.json
    depends_on:
      - opensearch

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # Optional MongoDB - uncomment if you want to use it instead of TinyDB
  # mongo:
  #   image: mongo:7
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db

volumes:
  opensearch_data:
  # mongo_data: